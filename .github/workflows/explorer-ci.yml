# Tests for the Python explorer (pyexplorer/). Also called by explorer-release.yml
# so a release tag is never deployed without a green test run.
name: explorer CI

on:
  push:
    paths: ["pyexplorer/**", ".github/workflows/explorer-*.yml"]
  pull_request:
    paths: ["pyexplorer/**", ".github/workflows/explorer-*.yml"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyexplorer
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d emc_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/emc_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check --select E,F,W,B --line-length 110 src tests
      - run: uv run pytest -q
