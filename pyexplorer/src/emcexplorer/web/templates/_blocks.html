<div class="scroll"><table class="list">
  <thead>
    <tr><th>Height</th><th title="Time since the block, when this page was loaded">Age</th><th>Proof</th><th class="num">Txs</th><th class="num">Mint, EMC</th><th class="num">Output, EMC</th><th>Hash</th></tr>
  </thead>
  <tbody>
  {% for b in blocks %}
    <tr>
      <td><a href="/block/{{ b.height }}">{{ b.height }}</a></td>
      <td class="nowrap mono" title="{{ b.time | utc }} UTC">{{ b.time | age }}</td>
      <td><span class="tag {{ b.proof }}">{{ b.proof | upper }}</span></td>
      <td class="num">{{ b.tx_count }}</td>
      <td class="num">{{ b.mint }}</td>
      <td class="num">{{ b.value_out }}</td>
      <td class="mono"><a href="/block/{{ b.hash }}">{{ b.hash | short(8) }}</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table></div>
